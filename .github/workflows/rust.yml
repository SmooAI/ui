name: Rust

# This repo shipped with no CI at all — `.github/` held only banner images — so a
# change could land unbuilt.
#
# It also used to carry a `shared-drift` job, because SmooAI/client-shared kept a
# byte-identical copy of `shared/` and the two silently diverged: client-shared
# spent weeks serving the pre-f230808 monogram (no inner 'S', no dot) because that
# fix never crossed. That copy is gone — client-shared is an auth library now, and
# nothing imported its `ui` module — so this repo is the single source of the
# design system and there is nothing left to drift against.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      # `--all-targets` so the test code is linted too; without it clippy
      # silently skips everything behind `#[cfg(test)]`.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Includes the generated-token cross-check against shared/styles.css,
      # in both directions.
      - name: Test
        run: cargo test

  module-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches a .rs file on disk that no `mod` declaration reaches, so it
      # never compiles and no other check can see it.
      - name: Every .rs file is reachable from the module tree
        run: python3 scripts/check-module-tree.py
